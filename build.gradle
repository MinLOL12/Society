plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'java'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Cursemaven – resolves curse.maven: dependency coordinates for mods on CurseForge
	maven {
		url = "https://cursemaven.com"
		content {
			includeGroup "curse.maven"
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// ChoiceTheorem's Overhauled Village (file 6459787) - NBT village structures for 1.20.1
	// Only needed at runtime; no CTOV classes are compiled against – the loader
	// discovers CTOV NBT structures via the "ctov" namespace if the mod is present.
	modRuntimeOnly "curse.maven:choicetheorems-overhauled-village-623908:6459787"

	// Lithostitched (file 6742616) - runtime library dependency required by CTOV on Fabric 1.20.1.
	modRuntimeOnly "curse.maven:lithostitched-936015:6742616"

	// AdoraBuild: Structures (file 5714699).  Its authored NBT templates are
	// used directly by Society when this optional world-generation mod is present.
	modRuntimeOnly "curse.maven:adorabuild-structures-883352:5714699"

	// Chef's Delight [Fabric] (file 7335194) provides Cook and Chef villager
	// professions. File 8547913 is its required food-library dependency.
	modRuntimeOnly "curse.maven:chefs-delight-fabric-736986:7335194"
	modRuntimeOnly "curse.maven:farmers-delight-fabric-398521:8547913"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
	it.options.encoding = "UTF-8"
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}
